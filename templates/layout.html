<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Relación Tóxica?{% endblock title %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <style>
            :root {
                --bs-primary: #800080;
                --bs-primary-rgb: 128, 0, 128;
                --bs-danger: #dc3545;
                --bs-warning: #ffc107;
            }

            body {
                background-color: #f8f9fa;
            }

            .btn-primary,
            .progress-bar,
            .bg-primary {
                background-color: var(--bs-primary) !important;
                border-color: var(--bs-primary) !important;
            }

            .btn-primary:hover {
                background-color: #6a006a !important;
                border-color: #6a006a !important;
            }

            .text-primary {
                color: var(--bs-primary) !important;
            }
        </style>

    </head>

    <body>
        <main class="container py-4">
            {% block main %}{% endblock main %}
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eY1p2w8QvW6O6s9D" crossorigin="anonymous"></script>
    </body>

</html>
